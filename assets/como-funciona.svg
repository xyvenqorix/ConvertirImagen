<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240" role="img" aria-label="Cómo se usa: abre una imagen, elige el formato, convierte y guarda" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Cómo se usa ConvertirImagen</title>
  <g transform="translate(20 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Abre una imagen</text>
    <text x="28" y="108" font-size="18" fill="#475569">Con el botón Abrir imagen.</text>
    <text x="28" y="134" font-size="18" fill="#475569">Se ve en la vista previa.</text>
    <g transform="translate(0 16)"><rect x="236" y="130" width="62" height="48" rx="8" fill="#E2E8F5" stroke="#94A3BE" stroke-width="2"/><circle cx="283" cy="144" r="6" fill="#F59E0B"/><polygon points="240,174 258,152 270,164 278,156 294,174" fill="#2563EB"/></g>
  </g>
  <path d="M350 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(390 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Elige el formato</text>
    <text x="28" y="108" font-size="18" fill="#475569">PNG, JPG, ICO, BMP, GIF, TIFF</text>
    <text x="28" y="134" font-size="18" fill="#475569">Para ICO: de 16 a 256 px.</text>
    <g transform="translate(0 16)"><rect x="232" y="132" width="70" height="46" rx="23" fill="#A838F0"/><text x="267" y="163" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">.ICO</text></g>
  </g>
  <path d="M720 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(760 20)">
    <rect width="320" height="200" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#2563EB"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#0F172A">Convierte y guarda</text>
    <text x="28" y="108" font-size="18" fill="#475569">Un clic y listo. Tú eliges</text>
    <text x="28" y="134" font-size="18" fill="#475569">dónde guardar el archivo.</text>
    <g transform="translate(0 16)"><rect x="236" y="130" width="62" height="48" rx="8" fill="#E2E8F5" stroke="#94A3BE" stroke-width="2"/><rect x="249" y="144" width="22" height="22" rx="6" fill="#A838F0"/><polygon points="274,150 288,150 288,160 294,160 281,172 268,160 274,160" fill="#10B981"/></g>
  </g>
</svg>
